<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/logo/logo-blanco.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App de ejercicios</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    // Si el invite aterriza en la home con #invite_token, abrimos el modal o redirigimos a /admin
    window.addEventListener('DOMContentLoaded', () => {
      if (location.hash.includes('invite_token')) {
        location.href = '/admin/' + location.hash;
      }
    });
  </script>
</body>

</html>
