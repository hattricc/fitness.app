backend:
  name: git-gateway
  branch: main # ó la rama que uses

media_folder: "public/images"
public_folder: "/images"

# publish_mode: editorial_workflow     # opcional: revisiones antes de publicar

# Colección por archivo: edita un único courses.json
collections:
  - name: "welcomeVideo"
    label: "Video de Bienvenida"
    files:
      - name: "welcome-video"
        label: "Video — Empieza Aquí"
        file: "src/data/welcome-video.json"
        format: "json"
        fields:
          - { name: "url", label: "URL del video (YouTube)", widget: "string", hint: "Ej: https://www.youtube.com/watch?v=xxxxx" }
          - { name: "buttonText", label: "Texto del botón", widget: "string", hint: "Ej: Empieza aquí" }

  - name: "armaRutina"
    label: "Arma tu propia rutina"
    files:
      - name: "arma-tu-rutina"
        label: "Categorías y ejercicios"
        file: "src/data/arma-tu-rutina.json"
        format: "json"
        fields:
          - { name: "name", label: "Nombre de la card", widget: "string" }
          - { name: "description", label: "Descripción corta", widget: "string" }
          - { name: "infoDescription", label: "Texto informativo", widget: "string" }
          - { name: "imageUrl", label: "Imagen de la card", widget: "image" }
          - { name: "visible", label: "Visible en Home", widget: "boolean", default: true }
          - name: "modules"
            label: "Categorías"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: "id", label: "ID (no cambiar)", widget: "string" }
              - { name: "name", label: "Nombre de categoría", widget: "string" }
              - name: "exercises"
                label: "Ejercicios"
                widget: "list"
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { name: "id", label: "ID (único, sin espacios)", widget: "string", hint: "Ej: ex-empujes-002" }
                  - { name: "name", label: "Nombre del ejercicio", widget: "string" }
                  - { name: "visible", label: "Visible", widget: "boolean", default: true }
                  - { name: "locked", label: "Requiere suscripción", widget: "boolean", default: false }
                  - name: "mediaType"
                    label: "Tipo de media"
                    widget: "select"
                    options:
                      - { label: "Imagen", value: "image" }
                      - { label: "Video", value: "video" }
                    default: "image"
                  - { name: "imageUrl", label: "Imagen", widget: "image", required: false, hint: "Para ejercicios tipo imagen" }
                  - { name: "url", label: "URL de video (YouTube)", widget: "string", required: false, hint: "Para ejercicios tipo video" }
                  - { name: "sets", label: "Series", widget: "string", required: false }
                  - { name: "repetitions", label: "Repeticiones", widget: "string", required: false }
                  - { name: "rest", label: "Descanso", widget: "string", required: false }
                  - { name: "duration", label: "Duración", widget: "string", required: false }

  - name: "coursesFile"
    label: "Cursos"
    label_singular: "Curso"
    files:
      - name: "courses"
        label: "Listado de cursos"
        file: "src/data/courses.cms.json"
        format: "json"
        fields:
          # Para no romper tu estructura original (array),
          # guardamos bajo la clave "items" y luego convertimos en build.
          - name: "items"
            label: "Cursos"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - { name: "id", label: "ID", widget: "string", hint: "slug único (ej. guia-movimientos-basicos)" }
              - { name: "name", label: "Nombre", widget: "string" }
              - { name: "showInfo", label: "Mostrar info", widget: "boolean", default: false }
              - { name: "infoDescription", label: "Descripción de info", widget: "text", required: false }
              - { name: "showDescription", label: "Mostrar descripción", widget: "boolean", default: false }
              - { name: "description", label: "Descripción", widget: "text", required: false }
              - { name: "locked", label: "Curso bloqueado", widget: "boolean", default: false, hint: "Si está activo, ningún ejercicio del curso podrá reproducirse" }
              - { name: "visible", label: "Visible", widget: "boolean", default: true }
              - name: "modules"
                label: "Módulos"
                widget: "list"
                collapsed: true
                summary: "{{fields.name}} ({{fields.category}}/{{fields.subcategory}})"
                fields:
                  - { name: "id", label: "ID", widget: "string" }
                  - { name: "visible", label: "Visible", widget: "boolean", default: true }
                  - { name: "duration", label: "Duración", widget: "string", required: false }
                  - { name: "name", label: "Nombre", widget: "string" }
                  - name: "exercises"
                    label: "Ejercicios"
                    widget: "list"
                    collapsed: true
                    summary: "{{fields.name}} ({{fields.duration}})"
                    fields:
                      - { name: "id", label: "ID", widget: "string" }
                      - { name: "visible", label: "Visible", widget: "boolean", default: true }
                      - { name: "locked", label: "Ejercicio bloqueado", widget: "boolean", default: true, hint: "Si está activo, el ejercicio no podrá reproducirse sin suscripción", required: false }
                      - { name: "name", label: "Nombre", widget: "string" }
                      - { name: "url", label: "URL", widget: "string", required: false }
                      - { name: "duration", label: "Duración", widget: "string", required: false }
