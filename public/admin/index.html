<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <!-- CMS Configuration -->
    <script src="/admin/config.yml" type="text/yaml"></script>
    
    <!-- Initialize CMS -->
    <script>
        // Enable manual initialization
        window.CMS_MANUAL_INIT = true;
        
        // Initialize CMS after everything is loaded
        document.addEventListener('DOMContentLoaded', function() {
            if (window.CMS) {
                window.CMS.init();
            }
        });
    </script>
    
    <!-- Load CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <!-- Custom extensions -->
    <script src="/admin/redirect.js"></script>
    <script src="/admin/extensions.js" defer></script>
</head>
<body>
    <div id="nc-root"></div>
</body>
</html>
