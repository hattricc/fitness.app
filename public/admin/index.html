<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        // Si llega un invite_token, abrimos el modal automáticamente
        window.addEventListener('DOMContentLoaded', () => {
            if (window.netlifyIdentity) {
                // Si venís con #invite_token en la URL, el widget lo procesa
                if (location.hash.includes('invite_token')) {
                    window.netlifyIdentity.open('signup'); // muestra el flujo para setear contraseña
                }

                // Tras login, recargamos /admin para que Decap tome la sesión
                window.netlifyIdentity.on('login', () => window.location.reload());
            }
        });
        </script>

    <!-- 👇 Indica que inicializarás manualmente -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js" defer></script>
    <script>
        // Espera al DOM y luego inicia
        window.addEventListener('DOMContentLoaded', () => {
            window.CMS && window.CMS.init();
        });
    </script>
    <script src="/admin/extensions.js" defer></script>
</head>

<body></body>

</html>
